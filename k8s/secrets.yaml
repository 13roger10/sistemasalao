# ──────────────────────────────────────────────────────────────────────────────
# Belezza — Kubernetes Secrets
#
# IMPORTANT: Do NOT commit this file with real values to version control.
# Generate base64 values with:   echo -n "value" | base64
#
# Recommended: use a secrets manager (AWS Secrets Manager, Vault, Sealed Secrets)
# and generate this file from a template in CI/CD.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: belezza-db-secret
  namespace: belezza
  labels:
    app.kubernetes.io/part-of: belezza
type: Opaque
data:
  # echo -n "belezza" | base64
  POSTGRES_USER: YmVsZXp6YQ==
  # echo -n "CHANGE_ME_strong_password" | base64
  POSTGRES_PASSWORD: Q0hBTkdFX01FX3N0cm9uZ19wYXNzd29yZA==
  # echo -n "belezza" | base64
  POSTGRES_DB: YmVsZXp6YQ==

---
apiVersion: v1
kind: Secret
metadata:
  name: belezza-app-secret
  namespace: belezza
  labels:
    app.kubernetes.io/part-of: belezza
type: Opaque
data:
  # echo -n "your-256-bit-jwt-secret-at-least-32-chars" | base64
  JWT_SECRET: eW91ci0yNTYtYml0LWp3dC1zZWNyZXQtYXQtbGVhc3QtMzItY2hhcnM=
  # echo -n "your-32-char-aes-key!!" | base64
  AES_SECRET_KEY: eW91ci0zMi1jaGFyLWFlcy1rZXkhIQ==
  # AWS credentials (leave empty if not using S3)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  # WhatsApp / Meta (leave empty if not configured)
  WHATSAPP_ACCESS_TOKEN: ""
  META_APP_SECRET: ""
  # OpenAI (leave empty if not using AI features)
  OPENAI_API_KEY: ""
  # VAPID keys for Web Push (generate with: npx web-push generate-vapid-keys)
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
