apiVersion: v1
kind: ConfigMap
metadata:
  name: belezza-config
  namespace: belezza
  labels:
    app.kubernetes.io/part-of: belezza
data:
  # ── Database ───────────────────────────────────────────────────────────────
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/belezza"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.PostgreSQLDialect"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  SPRING_FLYWAY_ENABLED: "true"
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"

  # ── Redis ──────────────────────────────────────────────────────────────────
  REDIS_ENABLED: "true"
  CACHE_TYPE: "redis"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # ── App URLs ───────────────────────────────────────────────────────────────
  FRONTEND_URL: "https://app.belezza.com.br"
  CORS_ALLOWED_ORIGINS: "https://app.belezza.com.br"

  # ── AWS S3 ─────────────────────────────────────────────────────────────────
  AWS_S3_BUCKET: "belezza-images"
  AWS_S3_REGION: "sa-east-1"

  # ── WhatsApp ───────────────────────────────────────────────────────────────
  WHATSAPP_RETRY_ENABLED: "true"
  WHATSAPP_LEMBRETES_ENABLED: "true"

  # ── RabbitMQ ───────────────────────────────────────────────────────────────
  RABBITMQ_ENABLED: "false"

  # ── Mail ───────────────────────────────────────────────────────────────────
  MAIL_ENABLED: "false"

  # ── Backup ─────────────────────────────────────────────────────────────────
  BACKUP_ENABLED: "false"

  # ── Meta Graph API ─────────────────────────────────────────────────────────
  META_API_VERSION: "v19.0"

  # ── Spring Profiles ────────────────────────────────────────────────────────
  SPRING_PROFILES_ACTIVE: "prod"

  # ── JVM tuning ─────────────────────────────────────────────────────────────
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
