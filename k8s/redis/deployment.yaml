apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: belezza
  labels:
    app: redis
    app.kubernetes.io/part-of: belezza
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # SEC-B02: hardening de pod (a imagem redis usa o usuário redis, uid 999).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          # SEC-B02: hardening de container (o volume /data é gravável).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # SEC-A03: Redis passa a exigir senha (--requirepass). Antes aceitava qualquer
          # comando de qualquer pod que alcançasse a porta, sem autenticação.
          command:
            - redis-server
            - "--save"
            - "60 1"         # snapshot every 60s if ≥1 key changed
            - "--loglevel"
            - "warning"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: belezza-app-secret
                  key: REDIS_PASSWORD
            # redis-cli (probes) autentica via variável de ambiente, sem expor a senha
            # na linha de comando do processo.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: belezza-app-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: redis-data
          emptyDir: {}
          # For persistent Redis (session cache), replace emptyDir with a PVC:
          # persistentVolumeClaim:
          #   claimName: redis-data
