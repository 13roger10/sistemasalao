apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: belezza
  labels:
    app: redis
    app.kubernetes.io/part-of: belezza
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - "--save"
            - "60 1"         # snapshot every 60s if ≥1 key changed
            - "--loglevel"
            - "warning"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: redis-data
          emptyDir: {}
          # For persistent Redis (session cache), replace emptyDir with a PVC:
          # persistentVolumeClaim:
          #   claimName: redis-data
