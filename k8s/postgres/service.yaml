apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: belezza
  labels:
    app: postgres
    app.kubernetes.io/part-of: belezza
spec:
  # ClusterIP (internal only) — DB must not be exposed externally
  type: ClusterIP
  clusterIP: None      # Headless service for StatefulSet DNS (postgres-0.postgres)
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
