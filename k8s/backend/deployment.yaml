apiVersion: apps/v1
kind: Deployment
metadata:
  name: belezza-api
  namespace: belezza
  labels:
    app: belezza-api
    app.kubernetes.io/part-of: belezza
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: belezza-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # Zero-downtime deploys
  template:
    metadata:
      labels:
        app: belezza-api
    spec:
      terminationGracePeriodSeconds: 30
      # SEC-B02: hardening de pod — processo não-root, sem escalonamento de privilégio.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # /tmp gravável para o Tomcat/Spring e para os logs (LOG_PATH=/tmp/logs),
        # já que o rootfs é somente-leitura.
        - name: tmp
          emptyDir: {}
      # Wait for postgres to be reachable before starting
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."; sleep 2
              done
              echo "Postgres is ready."
      containers:
        - name: belezza-api
          # Replace with your actual registry image:
          # image: ghcr.io/<org>/belezza-api:latest
          image: belezza/api:latest
          imagePullPolicy: Always
          # SEC-B02: hardening de container.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
              name: http
          # Non-sensitive config from ConfigMap
          envFrom:
            - configMapRef:
                name: belezza-config
          # Sensitive values from Secrets
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: belezza-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: belezza-db-secret
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: belezza-app-secret
                  key: JWT_SECRET
            - name: AES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: belezza-app-secret
                  key: AES_SECRET_KEY
            # BUG-004: senha do admin inicial (admin@belezza.ai); sem ela a conta é desativada
            - name: BELEZZA_ADMIN_INICIAL_SENHA
              valueFrom:
                secretKeyRef:
                  name: belezza-app-secret
                  key: BELEZZA_ADMIN_INICIAL_SENHA
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: belezza-app-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: belezza-app-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: WHATSAPP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: belezza-app-secret
                  key: WHATSAPP_ACCESS_TOKEN
            - name: META_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: belezza-app-secret
                  key: META_APP_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: belezza-app-secret
                  key: OPENAI_API_KEY
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: belezza-app-secret
                  key: VAPID_PUBLIC_KEY
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: belezza-app-secret
                  key: VAPID_PRIVATE_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Graceful shutdown: allow in-flight requests to complete
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
