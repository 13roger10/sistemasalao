# kustomization.yaml — apply the entire stack with:
#   kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: belezza

resources:
  - namespace.yaml
  # SEC-B04: secrets.yaml não é versionado — crie-o a partir de secrets.example.yaml
  # (ou gere via Sealed Secrets/Vault) antes de aplicar o stack.
  - secrets.yaml
  - configmap.yaml
  # Infrastructure
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  # Application
  - backend/deployment.yaml
  - backend/service.yaml
  - backend/hpa.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/hpa.yaml
  # Networking
  - ingress.yaml
