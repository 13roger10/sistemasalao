services:
  postgres:
    image: postgres:16-alpine
    container_name: belezza-postgres
    environment:
      POSTGRES_DB: belezza
      POSTGRES_USER: belezza
      POSTGRES_PASSWORD: belezza123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belezza -d belezza"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: belezza-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./belezza-api
      dockerfile: Dockerfile
    container_name: belezza-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/belezza
      SPRING_DATASOURCE_USERNAME: belezza
      SPRING_DATASOURCE_PASSWORD: belezza123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      REDIS_ENABLED: "false"
      CACHE_TYPE: simple
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
