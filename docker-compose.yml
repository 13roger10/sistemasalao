# Ambiente local com Docker. Segurança:
# - as portas ficam presas ao 127.0.0.1: banco, Redis e API não aparecem na rede
#   (antes ficavam em 0.0.0.0, abertos para qualquer máquina que alcançasse esta);
# - senhas obrigatórias, sem padrão no arquivo: defina DB_PASSWORD e REDIS_PASSWORD no .env
#   (copie .env.example).

services:
  postgres:
    image: postgres:16-alpine
    container_name: belezza-postgres
    environment:
      POSTGRES_DB: belezza
      POSTGRES_USER: belezza
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env - veja .env.example}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belezza -d belezza"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: belezza-redis
    # Redis sem senha aceitava qualquer comando de quem alcançasse a porta
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env - veja .env.example}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env - veja .env.example}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./belezza-api
      dockerfile: Dockerfile
    container_name: belezza-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/belezza
      SPRING_DATASOURCE_USERNAME: belezza
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env - veja .env.example}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      # BUG-009: sem default no application.yml — sem eles o backend não sobe (antes subia com o
      # segredo público do código e qualquer um forjava tokens)
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env - veja .env.example}
      AES_SECRET_KEY: ${AES_SECRET_KEY:?Defina AES_SECRET_KEY no arquivo .env - veja .env.example}
      REDIS_ENABLED: "false"
      CACHE_TYPE: simple
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
