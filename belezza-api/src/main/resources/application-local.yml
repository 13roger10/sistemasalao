# Belezza API - Local Profile
# Uses H2 file-based database (no Docker required)
# Data persists on disk across backend restarts (belezza-api/data/belezza_local.mv.db)
# Run with: mvnw spring-boot:run -Dspring-boot.run.profiles=local

spring:
  # Disable mail
  mail:
    enabled: false

  # H2 File-Based Database (PostgreSQL compatibility mode)
  # AUTO_SERVER allows the H2 console / a second connection to attach while the app runs
  datasource:
    url: jdbc:h2:file:./data/belezza_local;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # 'update' preserves existing data/schema across restarts (was 'create-drop', which wiped data every restart)
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Disable Flyway (using ddl-auto instead)
  flyway:
    enabled: false

  # H2 Console (access at http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        # SEC-010: aceita conexões apenas do localhost (não expõe o console na rede).
        web-allow-others: false

  # Disable Redis completely
  data:
    redis:
      enabled: false
      host: localhost
      port: 6379

  # Use simple cache instead of Redis
  cache:
    type: simple

  # Exclude Redis auto-configuration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Application settings
belezza:
  # Disable rate limiting
  rate-limit:
    enabled: false

  # CORS for local development
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000

  # Disable backup
  backup:
    enabled: false

  # Disable WhatsApp
  whatsapp:
    retry:
      enabled: false
    lembretes:
      enabled: false

# Swagger enabled
springdoc:
  swagger-ui:
    enabled: true

# Actuator - show all but disable Redis health check
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    # Mail and RabbitMQ are external services this local dev profile never runs (no SMTP
    # server, no broker) — their auto-registered health indicators were failing every
    # /actuator/health check and reporting the whole app DOWN even though it was fully
    # functional. Same reasoning as disabling the redis check above.
    mail:
      enabled: false
    rabbit:
      enabled: false

# Logging
logging:
  level:
    root: INFO
    com.belezza: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
