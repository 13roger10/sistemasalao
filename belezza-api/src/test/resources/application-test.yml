spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    clean-on-validation-error: true

  # Mail Configuration (disabled for tests)
  mail:
    enabled: false

  # Redis Configuration (disabled for tests unless needed)
  data:
    redis:
      enabled: false

# "spring.mail.enabled" acima não é uma propriedade do Spring: o health do e-mail seguia ativo,
# ficava DOWN sem servidor SMTP e /actuator/health respondia 503
management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.belezza: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.testcontainers: INFO
    com.github.dockerjava: WARN
